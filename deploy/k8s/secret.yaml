apiVersion: v1
kind: Secret
metadata:
  name: crypto-payment-secrets
  annotations:
    # GCP Secret Manager CSI Driver integration
    # In production, mount secrets from Secret Manager using CSI driver:
    # https://cloud.google.com/secret-manager/docs/secret-manager-managed-csi-component
type: Opaque
stringData:
  # These are placeholder values for local testing only
  # In production, replace this Secret with SecretProviderClass + CSI volume mount
  database-url: "postgres://user:pass@postgres-service:5432/crypto_payment_service?sslmode=require"
  bitgo-api-key: "placeholder-bitgo-key"
  bitgo-webhook-secret: "placeholder-webhook-secret"

