name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  atlas-lint:
    name: Atlas Migration Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Atlas
      uses: ariga/setup-atlas@v0

    - name: Run atlas migrate lint
      run: atlas migrate lint --dev-url "docker://postgres/15/dev" --dir "file://migrations" --latest=1

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crypto_payment_service
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      run: go mod download

    - name: Run linters
      run: |
        go fmt ./...
        go vet ./...

    - name: Run unit tests
      run: go test ./... -short -v -race -coverprofile=coverage.out -covermode=atomic

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella

    - name: Run PostgreSQL contention tests
      env:
        TEST_DB_URL: postgres://postgres:postgres@localhost:5433/crypto_payment_service?sslmode=disable
      run: go test -race -count=1 -v -run 'ConcurrentRace' ./internal/repository/

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, atlas-lint]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Build binaries
      run: |
        go build -o bin/webhook-server ./cmd/webhook-server/main.go
        go build -o bin/withdrawal-worker ./cmd/withdrawal-worker/main.go
        go build -o bin/migrate ./cmd/migrate/main.go

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries
        path: bin/
